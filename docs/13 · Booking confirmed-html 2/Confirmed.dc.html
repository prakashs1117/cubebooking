<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Booking confirmed</title>
<script src="./vendor/react.js"></script>
<script src="./vendor/react-dom.js"></script>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/liquidcarbon/components/bundle.css">
<script src="ds/liquidcarbon/components/bundle.js"></script>
<link rel="stylesheet" href="theme.css">
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Display:wght@500;600;700;800&amp;family=Noto+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>body{margin:0} @keyframes cfFall{0%{transform:translateY(-40px) rotate(0);opacity:0}15%{opacity:1}100%{transform:translateY(0) rotate(200deg);opacity:1}}</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; display: flex; flex-direction: column; background: var(--brand-purple); font-family: var(--font-sans); color: #ffffff">
  <sc-for list="{{confetti}}" as="c" hint-placeholder-count="18">
    <span aria-hidden="true" style="position: absolute; left: {{c.x}}; top: {{c.y}}; width: {{c.s}}; height: {{c.h}}; border-radius: {{c.r}}; background: {{c.bg}}; animation: cfFall 1.1s {{c.d}} cubic-bezier(.2,.8,.2,1) both"></span>
  </sc-for>

  <div style="position: relative; padding: 96px 28px 28px; display: flex; flex-direction: column; align-items: center; text-align: center; gap: 14px">
    <span style="display: grid; place-items: center; width: 96px; height: 96px; border-radius: 9999px; background: var(--brand-mint); color: var(--foreground); box-shadow: 0 0 0 12px rgba(150,215,210,0.22); animation: lcPop .6s .1s cubic-bezier(.2,.8,.2,1) both">
      <svg class="i" viewBox="0 0 24 24" style="width: 44px; height: 44px; stroke-width: 2.6"><path d="M20 6 9 17l-5-5"></path></svg></span>
    <h1 class="rise-2" style="margin: 8px 0 0; font-family: var(--font-display); font-size: 36px; line-height: 40px; font-weight: 800; letter-spacing: -0.02em">You're booked!</h1>
    <p class="rise-3" style="margin: 0; font-size: 16px; line-height: 24px; color: rgba(255,255,255,0.88)">Cube + Lab for class 4b<br>Thu, 15 Oct 2026 · 09:00–10:30</p>
  </div>

  <div class="rise-4" style="position: relative; margin: 0 20px; padding: 18px; border-radius: 24px; background: var(--background); color: var(--foreground); display: flex; gap: 16px; align-items: center">
    <div style="flex: none; display: grid; place-items: center; width: 84px; height: 84px; border-radius: 16px; background: var(--muted)"><svg class="i" viewBox="0 0 24 24" style="width: 44px; height: 44px; stroke-width: 1.6"><rect width="5" height="5" x="3" y="3" rx="1"></rect><rect width="5" height="5" x="16" y="3" rx="1"></rect><rect width="5" height="5" x="3" y="16" rx="1"></rect><path d="M21 16h-3a2 2 0 0 0-2 2v3"></path><path d="M21 21v.01"></path><path d="M12 7v3a2 2 0 0 1-2 2H7"></path><path d="M3 12h.01"></path><path d="M12 3h.01"></path><path d="M12 16v.01"></path><path d="M16 12h1"></path><path d="M21 12v.01"></path><path d="M12 21v-1"></path></svg></div>
    <div style="display: flex; flex-direction: column; gap: 2px">
      <span style="font-size: 12px; color: var(--muted-foreground)">Booking code</span>
      <span style="font-family: var(--font-display); font-size: 22px; font-weight: 800; letter-spacing: 0.04em">CC-4B7Q</span>
      <span style="font-size: 13px; line-height: 18px; color: var(--muted-foreground)">Your ticket and QR code are in your email.</span>
    </div>
  </div>

  <div style="margin-top: auto; padding: 20px 20px 30px; display: flex; flex-direction: column; gap: 10px">
    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
      <a href="#" class="tap" style="display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 48px; border-radius: var(--radius-xl); background: rgba(255,255,255,0.14); color: #ffffff; text-decoration: none; font-size: 15px; font-weight: 600"><svg class="i i-sm" viewBox="0 0 24 24"><path d="M8 2v4"></path><path d="M16 2v4"></path><rect width="18" height="18" x="3" y="4" rx="2"></rect><path d="M3 10h18"></path></svg>Google</a>
      <a href="#" class="tap" style="display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 48px; border-radius: var(--radius-xl); background: rgba(255,255,255,0.14); color: #ffffff; text-decoration: none; font-size: 15px; font-weight: 600"><svg class="i i-sm" viewBox="0 0 24 24"><path d="M12 15V3"></path><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><path d="m7 10 5 5 5-5"></path></svg>Outlook .ics</a>
    </div>
    <a href="Kit.dc.html" class="tap" style="display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 52px; border-radius: var(--radius-xl); background: var(--background); color: var(--foreground); text-decoration: none; font-size: 15px; font-weight: 700">Open pre-visit kit<svg class="i i-sm" viewBox="0 0 24 24"><path d="M5 12h14"></path><path d="m12 5 7 7-7 7"></path></svg></a>
    <a href="Bookings.dc.html" style="display: inline-flex; align-items: center; justify-content: center; min-height: 44px; color: #ffffff; font-size: 14px; font-weight: 500">Go to my bookings</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const cols = ['var(--brand-mint)', 'var(--brand-yellow)', 'var(--brand-magenta)', 'var(--brand-lime)', 'var(--brand-cyan)'];
    const confetti = Array.from({ length: 18 }, (_, i) => {
      const x = (i * 53 + 17) % 360, y = 30 + ((i * 97) % 260);
      const round = i % 3 === 0;
      return { x: x + 'px', y: y + 'px', s: (round ? 10 : 8) + 'px', h: (round ? 10 : 16) + 'px', r: round ? '9999px' : '3px', bg: cols[i % cols.length], d: (i % 6) * 0.07 + 's' };
    });
    return { confetti };
  }
}
</script>
</body>
</html>
