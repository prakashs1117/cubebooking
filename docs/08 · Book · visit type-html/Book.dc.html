<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Book: choose visit type</title>
<script src="./vendor/react.js"></script>
<script src="./vendor/react-dom.js"></script>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/liquidcarbon/components/bundle.css">
<script src="ds/liquidcarbon/components/bundle.js"></script>
<link rel="stylesheet" href="theme.css">
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Display:wght@500;600;700;800&amp;family=Noto+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; display: flex; flex-direction: column; background: var(--app-ground); font-family: var(--font-sans); color: var(--foreground)">
  <header style="padding: 44px 12px 8px; display: flex; flex-direction: column; gap: 12px">
    <div style="display: flex; align-items: center; gap: 4px">
      <a href="Home.dc.html" class="iconbtn tap" aria-label="Close"><svg class="i" viewBox="0 0 24 24"><path d="M18 6 6 18"></path><path d="m6 6 12 12"></path></svg></a>
      <span style="flex-grow: 1; text-align: center; font-size: 15px; font-weight: 600">Book a visit</span>
      <span style="width: 44px; font-size: 12px; font-weight: 600; color: var(--muted-foreground)">1 / 4</span>
    </div>
    <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; padding: 0 8px">
      <span style="height: 4px; border-radius: 9999px; background: var(--primary)"></span><span style="height: 4px; border-radius: 9999px; background: var(--border)"></span><span style="height: 4px; border-radius: 9999px; background: var(--border)"></span><span style="height: 4px; border-radius: 9999px; background: var(--border)"></span>
    </div>
  </header>

  <main class="scroll" style="flex-grow: 1; min-height: 0; padding: 12px 20px 24px; display: flex; flex-direction: column; gap: 16px">
    <div class="rise">
      <h1 style="margin: 0; font-family: var(--font-display); font-size: 28px; line-height: 34px; font-weight: 800; letter-spacing: -0.02em">How would you like to visit?</h1>
      <p style="margin: 6px 0 0; font-size: 15px; line-height: 22px; color: var(--muted-foreground)">Choose where the science happens.</p>
    </div>

    <button type="button" class="tap rise-2" onClick="{{pickOnsite}}" aria-pressed="{{isOnsite}}" style="position: relative; text-align: left; font: inherit; color: inherit; padding: 0; border-radius: 24px; background: var(--card); border: 2px solid {{onsiteBorder}}; box-shadow: {{onsiteShadow}}; overflow: hidden; cursor: pointer">
      <div style="position: relative; height: 120px; background: var(--brand-mint); overflow: hidden">
        <div style="position: absolute; width: 160px; height: 160px; border-radius: 9999px; background: var(--brand-yellow); right: -30px; top: 20px"></div>
        <div style="position: absolute; width: 70px; height: 70px; border-radius: 9999px; background: var(--brand-lime); left: 140px; top: -20px"></div>
        <div style="position: absolute; left: 20px; bottom: 16px; display: flex; gap: 8px">
          <span style="display: grid; place-items: center; width: 52px; height: 52px; border-radius: 16px; background: var(--background); box-shadow: var(--shadow-sm)"><svg class="i i-lg" viewBox="0 0 24 24"><path d="M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z"></path><path d="m3.3 7 8.7 5 8.7-5"></path><path d="M12 22V12"></path></svg></span>
          <span style="display: grid; place-items: center; width: 52px; height: 52px; border-radius: 16px; background: var(--background); box-shadow: var(--shadow-sm)"><svg class="i i-lg" viewBox="0 0 24 24"><path d="M10 2v7.527a2 2 0 0 1-.211.896L4.72 20.55a1 1 0 0 0 .9 1.45h12.76a1 1 0 0 0 .9-1.45l-5.069-10.127A2 2 0 0 1 14 9.527V2"></path><path d="M8.5 2h7"></path><path d="M7 16h10"></path></svg></span>
        </div>
        <sc-if value="{{isOnsite}}" hint-placeholder-val="{{true}}"><span style="position: absolute; top: 14px; right: 14px; display: grid; place-items: center; width: 30px; height: 30px; border-radius: 9999px; background: var(--primary); color: var(--primary-foreground); animation: lcPop .35s both"><svg class="i i-sm" viewBox="0 0 24 24" style="stroke-width: 3"><path d="M20 6 9 17l-5-5"></path></svg></span></sc-if>
      </div>
      <div style="padding: 16px 18px 18px; display: flex; flex-direction: column; gap: 6px">
        <span style="font-family: var(--font-display); font-size: 20px; line-height: 26px; font-weight: 700">Onsite STEM visit</span>
        <span style="font-size: 14px; line-height: 20px; color: var(--muted-foreground)">Your class comes to Curiosity Labs in Darmstadt. Book the Cube, the Lab, or both back to back.</span>
        <span style="align-self: flex-start; margin-top: 6px; display: inline-flex; gap: 6px; align-items: center; padding: 4px 10px; border-radius: 9999px; background: var(--accent); color: var(--brand-green); font-size: 12px; font-weight: 700"><svg class="i" viewBox="0 0 24 24" style="width: 14px; height: 14px"><path d="M13 2 3 14h9l-1 8 10-12h-9l1-8z"></path></svg>Confirmed instantly</span>
      </div>
    </button>

    <button type="button" class="tap rise-3" onClick="{{pickToad}}" aria-pressed="{{isToad}}" style="position: relative; text-align: left; font: inherit; color: inherit; padding: 0; border-radius: 24px; background: var(--card); border: 2px solid {{toadBorder}}; box-shadow: {{toadShadow}}; overflow: hidden; cursor: pointer">
      <div style="position: relative; height: 120px; background: var(--brand-magenta); overflow: hidden">
        <div style="position: absolute; width: 150px; height: 150px; border-radius: 9999px; background: var(--brand-purple); right: -20px; top: -60px"></div>
        <div style="position: absolute; width: 56px; height: 56px; border-radius: 9999px; background: var(--brand-mint); left: 160px; bottom: -18px"></div>
        <span style="position: absolute; left: 20px; bottom: 16px; display: grid; place-items: center; width: 52px; height: 52px; border-radius: 16px; background: var(--background); box-shadow: var(--shadow-sm)"><svg class="i i-lg" viewBox="0 0 24 24"><path d="M14 18V6a2 2 0 0 0-2-2H4a2 2 0 0 0-2 2v11a1 1 0 0 0 1 1h2"></path><path d="M15 18H9"></path><path d="M19 18h2a1 1 0 0 0 1-1v-3.65a1 1 0 0 0-.22-.624l-3.48-4.35A1 1 0 0 0 17.52 8H14"></path><circle cx="17" cy="18" r="2"></circle><circle cx="7" cy="18" r="2"></circle></svg></span>
        <sc-if value="{{isToad}}" hint-placeholder-val="{{false}}"><span style="position: absolute; top: 14px; right: 14px; display: grid; place-items: center; width: 30px; height: 30px; border-radius: 9999px; background: var(--primary); color: var(--primary-foreground); animation: lcPop .35s both"><svg class="i i-sm" viewBox="0 0 24 24" style="stroke-width: 3"><path d="M20 6 9 17l-5-5"></path></svg></span></sc-if>
      </div>
      <div style="padding: 16px 18px 18px; display: flex; flex-direction: column; gap: 6px">
        <span style="font-family: var(--font-display); font-size: 20px; line-height: 26px; font-weight: 700">TOAD truck visit</span>
        <span style="font-size: 14px; line-height: 20px; color: var(--muted-foreground)">The truck comes to your school. Darmstadt area only for now.</span>
        <span style="align-self: flex-start; margin-top: 6px; display: inline-flex; gap: 6px; align-items: center; padding: 4px 10px; border-radius: 9999px; background: var(--tint-yellow); font-size: 12px; font-weight: 700"><svg class="i" viewBox="0 0 24 24" style="width: 14px; height: 14px"><circle cx="12" cy="12" r="10"></circle><path d="M12 6v6l4 2"></path></svg>Merck approves first</span>
      </div>
    </button>
  </main>

  <footer style="padding: 12px 20px 30px; background: var(--background); border-top: 1px solid var(--border)">
    <a href="{{next}}" class="lc-btn lc-btn--default lc-btn--size-lg tap" style="width: 100%">Continue<svg class="i i-sm" viewBox="0 0 24 24"><path d="M5 12h14"></path><path d="m12 5 7 7-7 7"></path></svg></a>
  </footer>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { type: 'onsite' }; }
  renderVals() {
    const on = this.state.type === 'onsite';
    const sel = 'var(--primary)', unsel = 'var(--border)';
    const shOn = '0 14px 30px -14px rgba(20,155,95,0.55)', shOff = 'none';
    return {
      isOnsite: on, isToad: !on,
      onsiteBorder: on ? sel : unsel, toadBorder: on ? unsel : sel,
      onsiteShadow: on ? shOn : shOff, toadShadow: on ? shOff : shOn,
      pickOnsite: () => this.setState({ type: 'onsite' }), pickToad: () => this.setState({ type: 'toad' }),
      next: on ? 'BookPrograms.dc.html' : 'ToadRequest.dc.html'
    };
  }
}
</script>
</body>
</html>
