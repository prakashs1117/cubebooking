<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#503291" />
    <meta name="description" content="Curiosity Cube & Labs — Book a STEM experience for your class" />
    <meta name="keywords" content="STEM, booking, curiosity, cube, lab, education" />
    <meta name="author" content="Curiosity Learning" />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />

    <!-- Open Graph (Social Media) -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://curiosity-booking.vercel.app/" />
    <meta property="og:title" content="Curiosity Booking" />
    <meta property="og:description" content="Book the Curiosity Cube, Lab, or TOAD truck for your class" />
    <meta property="og:image" content="https://curiosity-booking.vercel.app/og-image.png" />
    <meta property="og:image:alt" content="Curiosity Cube - STEM Learning Experience" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Curiosity Booking" />
    <meta name="twitter:description" content="Book the Curiosity Cube, Lab, or TOAD truck for your class" />
    <meta name="twitter:image" content="https://curiosity-booking.vercel.app/og-image.png" />

    <!-- Additional Meta Tags -->
    <meta name="robots" content="index, follow" />
    <meta name="language" content="English" />
    <meta name="revisit-after" content="7 days" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500&family=Noto+Sans+Display:wght@500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>Curiosity Booking</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function(registrations) {
          for (var r of registrations) r.unregister();
        });
      }
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
